name: Verify ROOM LIVE build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: node --check functions/index.js && node --check scripts/migrate-v2.cjs
      - run: node -e "JSON.parse(require('node:fs').readFileSync('database.rules.json','utf8'))"
      - run: npm run build
