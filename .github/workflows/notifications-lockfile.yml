name: Generate notifications lockfile
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/notifications-lockfile.yml'
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate package-lock.json
        working-directory: workers/notifications
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/notifications/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(notifications): add npm lockfile for Cloudflare build"
            git push
          fi
